name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies (lightweight — no heavy ML packages)
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend tests

      - name: Type check
        run: mypy backend
        continue-on-error: true # tightening in progress; don't block CI yet

      - name: Test with coverage
        env:
          GROQ_API_KEY: dummy-ci-key
        run: pytest --cov-report=xml
